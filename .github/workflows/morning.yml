# Hourly call to the morning-outfit job at :30; the job itself picks the people whose clock reads 6:30.
name: Morning notifications
on:
  schedule:
    - cron: "30 * * * *" # half past: the job sends to everyone in their 6 o'clock hour, so this lands at 6:30
  workflow_dispatch:
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the morning job
        env:
          SECRET: ${{ secrets.MORNING_CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $SECRET" https://www.myvalette.com/api/cron/morning
